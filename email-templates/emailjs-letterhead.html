<!--
  Bharat Mahotsav letterhead for EmailJS.
  Paste this whole file into your EmailJS template: Content → code view (< >) → replace everything.
  Template settings:  Subject {{subject}} · To Email {{to_email}} · From Name Bharat Connect · Reply To info@bharatconnect.live
  The website fills {{{html}}} with the message (title, text, buttons). The two images are served by the website.
-->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#eef1f6;font-family:Arial,Helvetica,sans-serif;color:#1c1f2a">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef1f6;padding:24px 12px">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden">

          <!-- letterhead: logo, BHARAT MAHOTSAV, tagline, divider -->
          <tr>
            <td>
              <img src="https://bharatconnect-aa30d.web.app/email/letterhead-top.jpg" width="600"
                   alt="Bharat Mahotsav · One India | One Vision | One Future"
                   style="display:block;width:100%;max-width:600px;height:auto;border:0">
            </td>
          </tr>

          <!-- the message, sent by the website -->
          <tr>
            <td style="padding:8px 36px 24px;font-size:15px;line-height:1.6;color:#1c1f2a">
              {{{html}}}
            </td>
          </tr>

          <!-- footer text -->
          <tr>
            <td style="padding:0 36px 22px;font-size:12px;line-height:1.6;color:#6b7184">
              Bharat Connect 2026 · Bharat-Arab Business Conclave · 18–19 Dec 2026, Yashobhoomi, New Delhi<br>
              Organised by IACCIA with Bharat Mahotsav Festivals LLP ·
              <a href="https://www.bharatconnect.live/terms/Bharat-Mahotsav-Festivals-LLP-Registration-Terms-and-Conditions-v1-04Nov2026.pdf" style="color:#ef7d1a">Terms and Conditions</a><br>
              Questions? Reply to this email or write to <a href="mailto:info@bharatconnect.live" style="color:#ef7d1a">info@bharatconnect.live</a>.
            </td>
          </tr>

          <!-- skyline -->
          <tr>
            <td>
              <img src="https://bharatconnect-aa30d.web.app/email/letterhead-bottom.jpg" width="600" alt=""
                   style="display:block;width:100%;max-width:600px;height:auto;border:0">
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
